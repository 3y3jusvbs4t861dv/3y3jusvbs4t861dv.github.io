const LINK_TITLE_TRANSLATION_CACHE_KEY="siteMapLinkTitleTranslationsV2";
function cleanLinkTitleTranslationCache(value){
  if(!value||typeof value!=="object"||Array.isArray(value))return{};
  const cleaned={};
  for(const [key,translated] of Object.entries(value)){
    const id=String(key||"").trim();
    const label=String(translated||"").trim();
    if(id&&label)cleaned[id]=label;
  }
  return cleaned;
}

}catch(_){}
const pendingLinkTitleTranslations=new Map();
const browserTitleTranslators=new Map();
const failedLinkTitleTranslationTimes=new Map();
const linkTitleTranslationJobs=[];
let activeLinkTitleTranslationJobs=0;
const MAX_ACTIVE_LINK_TITLE_TRANSLATION_JOBS=3;
function runNextLinkTitleTranslationJob(){
  while(activeLinkTitleTranslationJobs<MAX_ACTIVE_LINK_TITLE_TRANSLATION_JOBS&&linkTitleTranslationJobs.length){
    const job=linkTitleTranslationJobs.shift();
    activeLinkTitleTranslationJobs++;
    Promise.resolve()
      .then(job.task)
      .then(job.resolve,job.reject)
      .finally(()=>{
        activeLinkTitleTranslationJobs--;
        runNextLinkTitleTranslationJob();
      });
  }
}
function scheduleLinkTitleTranslationJob(task){
  return new Promise((resolve,reject)=>{
    linkTitleTranslationJobs.push({task,resolve,reject});
    runNextLinkTitleTranslationJob();
  });
}

function normalizeEnglishTitleKey(value){
  return String(value||"")
    .normalize("NFKC")
    .replace(/&/g," AND ")
    .replace(/[\/\-]+/g," ")
    .replace(/[^\p{L}\p{N}]+/gu," ")
    .trim()
    .replace(/\s+/g," ")
    .replace(/\bDROP OFF\b/g,"DROPOFF")
    .replace(/\bPICK UP\b/g,"PICKUP")
    .toUpperCase();
}

function knownEditedLinkTranslation(englishTitle,item,targetLanguage){
  const target=String(targetLanguage||"en");
  if(target==="en")return String(englishTitle||"");
  const normalized=normalizeEnglishTitleKey(englishTitle);
  const alias=EDITED_LINK_TITLE_ALIASES[normalized];
  if(alias&&alias[target])return alias[target];

  for(const [key,currentEnglish] of Object.entries(CURRENT_LINK_ENGLISH_BY_KEY)){
    if(normalizeEnglishTitleKey(currentEnglish)!==normalized)continue;
    const override=CURRENT_LINK_TRANSLATION_OVERRIDES[target];
    return String(override&&override[key]||LINK_I18N[target]&&LINK_I18N[target][key]||currentEnglish);
  }

  for(const [key,defaultEnglish] of Object.entries(LINK_I18N.en||{})){
    if(normalizeEnglishTitleKey(defaultEnglish)!==normalized)continue;
    return String(LINK_I18N[target]&&LINK_I18N[target][key]||defaultEnglish);
  }

  if(item&&item.i18nKey){
    const currentEnglish=CURRENT_LINK_ENGLISH_BY_KEY[item.i18nKey];
    if(currentEnglish&&normalizeEnglishTitleKey(currentEnglish)===normalized){
      const override=CURRENT_LINK_TRANSLATION_OVERRIDES[target];
      return String(override&&override[item.i18nKey]||LINK_I18N[target]&&LINK_I18N[target][item.i18nKey]||englishTitle);
    }
  }
  return "";
}

function linkTitleTranslationCacheId(englishTitle,targetLanguage){
  return `${targetLanguage}|${normalizeEnglishTitleKey(englishTitle)}`;
}

function decodeTranslationText(value){
  const source=String(value||"");
  if(!source.includes("&"))return source.trim();
  const control=document.createElement("textarea");
  control.innerHTML=source;
  return String(control.value||"").trim();
}
function hasWordsNeedingTranslation(source){
  return String(source||"")
    .replace(/\b(?:FEDEX|AIRNAV|UPS|USPS|DHL|URL|HTTP|HTTPS)\b/gi," ")
    .replace(/[0-9+()#*._:/\-]+/g," ")
    .replace(/[^\p{L}]+/gu,"")
    .length>0;
}
function usableTranslatedLinkTitle(source,translated){
  const original=String(source||"").trim();
  const result=decodeTranslationText(translated);
  if(!result)return"";
  if(!hasWordsNeedingTranslation(original))return result;
  if(normalizeEnglishTitleKey(result)===normalizeEnglishTitleKey(original))return"";
  return result;
}
async function fetchTranslationJson(url,timeoutMs=10000){
  const controller=typeof AbortController==="function"?new AbortController():null;
  const timeout=controller?setTimeout(()=>controller.abort(),timeoutMs):0;
  try{
    const response=await fetch(url,{method:"GET",cache:"no-store",signal:controller?controller.signal:undefined});
    if(!response.ok)throw new Error("TRANSLATION REQUEST FAILED");
    return await response.json();
  }finally{
    if(timeout)clearTimeout(timeout);
  }
}
async function googleTranslateLinkTitle(englishTitle,targetLanguage){
  const target=targetLanguage==="zh"?"zh-CN":String(targetLanguage||"");
  const endpoint="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl="+
    encodeURIComponent(target)+"&dt=t&q="+encodeURIComponent(englishTitle);
  const data=await fetchTranslationJson(endpoint);
  const translated=Array.isArray(data&&data[0])
    ?data[0].map(part=>Array.isArray(part)?String(part[0]||""):"").join("").trim()
    :"";
  return usableTranslatedLinkTitle(englishTitle,translated);
}
async function myMemoryTranslateLinkTitle(englishTitle,targetLanguage){
  const target=targetLanguage==="zh"?"zh-CN":String(targetLanguage||"");
  const endpoint="https://api.mymemory.translated.net/get?q="+
    encodeURIComponent(englishTitle)+"&langpair=en%7C"+encodeURIComponent(target);
  const data=await fetchTranslationJson(endpoint,12000);
  return usableTranslatedLinkTitle(
    englishTitle,
    data&&data.responseData&&data.responseData.translatedText
  );
}
async function remoteTranslateLinkTitle(englishTitle,targetLanguage){
  const source=String(englishTitle||"").trim();
  if(!source)return"";
  const providers=[googleTranslateLinkTitle,myMemoryTranslateLinkTitle];
  let lastError=null;
  for(const provider of providers){
    try{
      const translated=await provider(source,targetLanguage);
      if(translated)return translated;
    }catch(error){lastError=error;}
  }
  throw lastError||new Error("NO TRANSLATION AVAILABLE");
}

async function browserTranslateLinkTitle(englishTitle,targetLanguage){
  const source=String(englishTitle||"").trim();
  if(!source)return"";
  const TranslatorApi=globalThis.Translator;
  if(TranslatorApi&&typeof TranslatorApi.create==="function"){
    try{
      let translator=browserTitleTranslators.get(targetLanguage);
      if(!translator){
        if(typeof TranslatorApi.availability==="function"){
          const availability=await TranslatorApi.availability({sourceLanguage:"en",targetLanguage});
          if(String(availability).toLowerCase()==="unavailable")throw new Error("TRANSLATOR UNAVAILABLE");
        }
        translator=await TranslatorApi.create({sourceLanguage:"en",targetLanguage});
        browserTitleTranslators.set(targetLanguage,translator);
      }
      const translated=usableTranslatedLinkTitle(source,await translator.translate(source));
      if(translated)return translated;
    }catch(_){}
  }
  return remoteTranslateLinkTitle(source,targetLanguage);
}

function persistLinkTitleTranslations(){
  try{localStorage.setItem(LINK_TITLE_TRANSLATION_CACHE_KEY,JSON.stringify(cachedLinkTitleTranslations));}catch(_){}
  try{
    if(cfg&&typeof cfg==="object")cfg.linkTitleTranslations={...cachedLinkTitleTranslations};
    saveCfg("",false);
  }catch(_){}
}
function queueEditedLinkTitleTranslation(englishTitle,targetLanguage){
  const source=String(englishTitle||"").trim();
  if(!source||targetLanguage==="en")return;
  const id=linkTitleTranslationCacheId(source,targetLanguage);
  const existing=usableTranslatedLinkTitle(source,cachedLinkTitleTranslations[id]);
  if(existing){
    if(existing!==cachedLinkTitleTranslations[id])cachedLinkTitleTranslations[id]=existing;
    return;
  }
  delete cachedLinkTitleTranslations[id];
  if(pendingLinkTitleTranslations.has(id))return;
  const failedAt=Number(failedLinkTitleTranslationTimes.get(id)||0);
  if(failedAt&&Date.now()-failedAt<8000)return;
  const pending=scheduleLinkTitleTranslationJob(()=>browserTranslateLinkTitle(source,targetLanguage))
    .then(translated=>{
      const usable=usableTranslatedLinkTitle(source,translated);
      if(!usable)throw new Error("UNUSABLE TRANSLATION");
      failedLinkTitleTranslationTimes.delete(id);
      cachedLinkTitleTranslations[id]=usable;
      persistLinkTitleTranslations();
      if(language===targetLanguage)render();
    })
    .catch(()=>{failedLinkTitleTranslationTimes.set(id,Date.now());})
    .finally(()=>pendingLinkTitleTranslations.delete(id));
  pendingLinkTitleTranslations.set(id,pending);
}

function translatedEditedLinkTitle(englishTitle,item,targetLanguage=language){
  const source=String(englishTitle||"").trim();
  if(!source||targetLanguage==="en")return source;
  const known=knownEditedLinkTranslation(source,item,targetLanguage);
  if(known)return known;
  const id=linkTitleTranslationCacheId(source,targetLanguage);
  const cached=usableTranslatedLinkTitle(source,cachedLinkTitleTranslations[id]);
  if(cached)return cached;
  delete cachedLinkTitleTranslations[id];
  queueEditedLinkTitleTranslation(source,targetLanguage);
  return source;
}
function queueAllLinkTitleTranslations(englishTitle,item){
  const source=String(englishTitle||"").trim();
  if(!source)return;
  SUPPORTED_LANGUAGES.forEach(targetLanguage=>{
    if(targetLanguage==="en")return;
    if(knownEditedLinkTranslation(source,item,targetLanguage))return;
    queueEditedLinkTitleTranslation(source,targetLanguage);
  });
}
function queueAllVisibleLinkTitleTranslations(){
  try{
    englishLinks().forEach(item=>queueAllLinkTitleTranslations(item.title,item));
    const englishPaintLabel=String(paintButtonNames&&paintButtonNames.en||"").trim();
    if(englishPaintLabel&&normalizeEnglishTitleKey(englishPaintLabel)!==normalizeEnglishTitleKey(PAINT_I18N.en.paint||"PAINT")){
      queueAllLinkTitleTranslations(englishPaintLabel,{kind:"paint"});
    }
  }catch(_){}
}

function normalizeDeviceLayoutProfile(value,fallback){
  const source=value&&typeof value==="object"&&!Array.isArray(value)?value:{};
  const base=fallback&&typeof fallback==="object"?fallback:{};
  const columns=Math.min(10,Math.max(1,Number(source.columns||base.columns||4)));
  return{
    columns,
    siteGridOrder:Array.isArray(source.siteGridOrder)
      ?source.siteGridOrder.map(String)
      :Array.isArray(base.siteGridOrder)?base.siteGridOrder.map(String):[],
    cubeSpans:normalizeCubeSpans(source.cubeSpans||base.cubeSpans),
    titleOverrides:source.titleOverrides&&typeof source.titleOverrides==="object"&&!Array.isArray(source.titleOverrides)
      ?Object.fromEntries(Object.entries(source.titleOverrides).map(([url,title])=>[String(url),String(title||"").trim()]).filter(([,title])=>title))
      :base.titleOverrides&&typeof base.titleOverrides==="object"&&!Array.isArray(base.titleOverrides)?{...base.titleOverrides}:{},
    updatedAt:Number(source.updatedAt||base.updatedAt||0)
  };
}

function normalizeDeviceLayouts(value,fallbackOrder=[],fallbackSpans={}){
  const defaults=defaultDeviceLayouts();
  const source=value&&typeof value==="object"&&!Array.isArray(value)?value:{};
  const hasProfiles=DEVICE_LAYOUT_KEYS.some(key=>source[key]&&typeof source[key]==="object");
  const result={};
  DEVICE_LAYOUT_KEYS.forEach(key=>{
    result[key]=normalizeDeviceLayoutProfile(source[key],defaults[key]);
  });
  if(!hasProfiles&&(Array.isArray(fallbackOrder)&&fallbackOrder.length||Object.keys(normalizeCubeSpans(fallbackSpans)).length)){
    const key=detectDeviceLayoutKey();
    result[key]=normalizeDeviceLayoutProfile({
      ...result[key],
      siteGridOrder:Array.isArray(fallbackOrder)&&fallbackOrder.length?fallbackOrder:result[key].siteGridOrder,
      cubeSpans:Object.keys(normalizeCubeSpans(fallbackSpans)).length?fallbackSpans:result[key].cubeSpans,
      updatedAt:Date.now()
    },defaults[key]);
  }
  return result;
}

function mergeDeviceLayouts(localValue,remoteValue){
  const local=normalizeDeviceLayouts(localValue);
  const remote=normalizeDeviceLayouts(remoteValue);
  const merged={};
  DEVICE_LAYOUT_KEYS.forEach(key=>{
    const localTime=Number(local[key].updatedAt||0);
    const remoteTime=Number(remote[key].updatedAt||0);
    merged[key]=normalizeDeviceLayoutProfile(
      remoteTime>=localTime?remote[key]:local[key],
      defaultDeviceLayouts()[key]
    );
  });
  return merged;
}

  try{

    return available.sort(

    )[0];

function syncActiveDeviceLayoutFromState(forceUpdated=false){
  const previous=normalizeDeviceLayoutProfile(
    deviceLayouts[activeDeviceLayoutKey],
    defaultDeviceLayouts()[activeDeviceLayoutKey]
  );
  const nextOrder=[...siteGridOrder];
  const nextSpans=normalizeCubeSpans(cubeSpans);
  const changed=JSON.stringify(previous.siteGridOrder)!==JSON.stringify(nextOrder)
    ||JSON.stringify(previous.cubeSpans)!==JSON.stringify(nextSpans);
  deviceLayouts[activeDeviceLayoutKey]={
    columns:previous.columns,
    siteGridOrder:nextOrder,
    cubeSpans:nextSpans,
    titleOverrides:{...previous.titleOverrides},
    updatedAt:forceUpdated||changed?Date.now():Number(previous.updatedAt||0)
  };
}

function loadActiveDeviceLayout(key=detectDeviceLayoutKey()){
  activeDeviceLayoutKey=DEVICE_LAYOUT_KEYS.includes(String(key))?String(key):"desktop";
  const profile=normalizeDeviceLayoutProfile(
    deviceLayouts[activeDeviceLayoutKey],
    defaultDeviceLayouts()[activeDeviceLayoutKey]
  );
  deviceLayouts[activeDeviceLayoutKey]=profile;
  siteGridOrder=[...profile.siteGridOrder];
  cubeSpans=normalizeCubeSpans(profile.cubeSpans);
  if(cfg){
    cfg.deviceLayouts=normalizeDeviceLayouts(deviceLayouts);
    cfg.siteGridOrder=[...siteGridOrder];
    cfg.cubeSpans=normalizeCubeSpans(cubeSpans);
  }
}

function switchActiveDeviceLayoutIfNeeded(){
  const next=detectDeviceLayoutKey();
  if(next===activeDeviceLayoutKey)return false;
  syncActiveDeviceLayoutFromState(false);
  loadActiveDeviceLayout(next);
  return true;
}

function removeTargetFromAllDeviceLayouts(target){
  syncActiveDeviceLayoutFromState(false);
  const normalized=String(target||"");
  const orderKey=normalized===PAINT_EDIT_KEY?"paint-launcher":layoutKeyForUrl(normalized);
  const stamp=Date.now();
  DEVICE_LAYOUT_KEYS.forEach(key=>{
    const profile=normalizeDeviceLayoutProfile(deviceLayouts[key],defaultDeviceLayouts()[key]);
    profile.siteGridOrder=profile.siteGridOrder.filter(item=>String(item)!==orderKey);
    delete profile.cubeSpans[normalized];
    if(profile.titleOverrides)delete profile.titleOverrides[normalized];
    profile.updatedAt=stamp;
    deviceLayouts[key]=profile;
  });
  loadActiveDeviceLayout(activeDeviceLayoutKey);
}

function replaceTargetInAllDeviceLayouts(oldTarget,newTarget){
  syncActiveDeviceLayoutFromState(false);
  const oldValue=String(oldTarget||"");
  const newValue=String(newTarget||"");
  const oldKey=oldValue===PAINT_EDIT_KEY?"paint-launcher":layoutKeyForUrl(oldValue);
  const newKey=newValue===PAINT_EDIT_KEY?"paint-launcher":layoutKeyForUrl(newValue);
  const stamp=Date.now();
  DEVICE_LAYOUT_KEYS.forEach(key=>{
    const profile=normalizeDeviceLayoutProfile(deviceLayouts[key],defaultDeviceLayouts()[key]);
    profile.siteGridOrder=profile.siteGridOrder
      .map(item=>String(item)===oldKey?newKey:String(item))
      .filter((item,index,array)=>array.indexOf(item)===index);
    if(profile.cubeSpans[oldValue]){
      profile.cubeSpans[newValue]=profile.cubeSpans[oldValue];
      delete profile.cubeSpans[oldValue];
    }
    if(profile.titleOverrides&&profile.titleOverrides[oldValue]){
      profile.titleOverrides[newValue]=profile.titleOverrides[oldValue];
      delete profile.titleOverrides[oldValue];
    }
    profile.updatedAt=stamp;
    deviceLayouts[key]=profile;
  });
  loadActiveDeviceLayout(activeDeviceLayoutKey);
}

  },1000);
}

function snapPaintSplit(value){
  return Math.round(
    Number(value||0)/PAINT_SPLIT_SNAP
  )*PAINT_SPLIT_SNAP;
}

function paintSplitAxisSize(){
  const rect=paintWorkspace.getBoundingClientRect();

    ?rect.height

function applyPaintSplit(ratio,save=true){
  const axis=Math.max(1,paintSplitAxisSize());
  const divider=window.matchMedia("(min-width:821px)").matches?9:11;
  const mobilePanelMinimum=Math.max(120,Number(paintWorkspace.dataset.paintPanelMinimum||120));
  const minimum=isPaintStackedLayout()?mobilePanelMinimum:150;
  const remainingMinimum=isPaintStackedLayout()?90:180;
  const maximum=Math.max(
    minimum,
    axis-divider-remainingMinimum
  );

  ratio=Math.min(isPaintStackedLayout()?.88:.78,Math.max(.18,Number(ratio||.42)));

  const pixels=Math.min(
    maximum,
    Math.max(
      minimum,
      snapPaintSplit(axis*ratio)
    )
  );

  paintWorkspace.style.setProperty(
    "--paint-tools-px",
    pixels+"px"
  );
  paintBox.style.setProperty(
    "--paint-tools-px",
    pixels+"px"
  );

  if(save){
    savePaintSplit(pixels/axis);
  }

  requestAnimationFrame(()=>{
    fitPaintToolbar();
    resizeFabricCanvas();
    window.dispatchEvent(new Event("paintsplitresize"));
  });
}

let paintToolbarFitFrame=0;
function paintControlContentFits(control){
  const rect=control.getBoundingClientRect();
  if(rect.width<2||rect.height<2)return false;
  const css=getComputedStyle(control);
  const left=rect.left+(parseFloat(css.paddingLeft)||0)-.5;
  const right=rect.right-(parseFloat(css.paddingRight)||0)+.5;
  const top=rect.top+(parseFloat(css.paddingTop)||0)-.5;
  const bottom=rect.bottom-(parseFloat(css.paddingBottom)||0)+.5;
  for(const child of control.children){
    if(child.hidden||getComputedStyle(child).display==="none")continue;
    const childRect=child.getBoundingClientRect();
    if(childRect.left<left||childRect.right>right||childRect.top<top||childRect.bottom>bottom)return false;
  }
  for(const descendant of control.querySelectorAll("*")){
    const style=getComputedStyle(descendant);
    if(descendant.hidden||style.display==="none")continue;
    if(["hidden","clip","auto","scroll"].includes(style.overflowX)&&descendant.scrollWidth>descendant.clientWidth+1)return false;
    if(["hidden","clip","auto","scroll"].includes(style.overflowY)&&descendant.scrollHeight>descendant.clientHeight+1)return false;
  }
  return control.scrollWidth<=control.clientWidth+1&&control.scrollHeight<=control.clientHeight+1;
}
function fitPaintControlText(control){
  const rect=control.getBoundingClientRect();
  if(rect.width<4||rect.height<4)return;
  const primaryControl=control.classList.contains("paint-color-square-control")||control.classList.contains("paint-brush-square-control");
  const label=primaryControl?control.querySelector(".paint-tool-field-label"):null;
  const labelText=label&&label.querySelector("span");
  if(primaryControl&&label&&labelText){
    control.style.setProperty("--paint-control-font-size","4px");
    label.style.removeProperty("font-size");
    const labelRect=label.getBoundingClientRect();
    let low=4;
    let high=Math.max(low,Math.min(140,Math.floor(labelRect.height*.94),Math.floor(labelRect.width*.62)));
    let best=low;
    for(let pass=0;pass<10&&low<=high;pass++){
      const size=Math.floor((low+high)/2);
      label.style.fontSize=size+"px";
      const fits=labelText.scrollWidth<=label.clientWidth+1&&labelText.scrollHeight<=label.clientHeight+1;
      if(fits){best=size;low=size+1;}else high=size-1;
    }
    label.style.fontSize=best+"px";
    return;
  }
  let low=4;
  let high=Math.max(low,Math.min(72,Math.floor(rect.height*.82),Math.floor(rect.width*.72)));
  let best=low;
  for(let pass=0;pass<9&&low<=high;pass++){
    const size=Math.floor((low+high)/2);
    control.style.setProperty("--paint-control-font-size",size+"px");
    if(paintControlContentFits(control)){best=size;low=size+1;}else high=size-1;
  }
  control.style.setProperty("--paint-control-font-size",best+"px");
}
function fitPaintToolbar(){
  cancelAnimationFrame(paintToolbarFitFrame);
  paintToolbarFitFrame=requestAnimationFrame(()=>{
    paintToolbarFitFrame=0;
    if(!paintToolbarGroups||!paintToolbar)return;
    const controls=paintToolControls();
    const count=controls.length;
    const width=paintToolbar.clientWidth;
    const height=paintToolbar.clientHeight;
    if(!count||width<20||height<20)return;
    const gap=4;
    const regularCount=Math.max(0,count-1);
    const longestWord=Math.max(1,...controls.flatMap(control=>
      [...control.querySelectorAll(".paint-tool-word,.paint-tool-field-label span")]
        .map(node=>String(node.textContent||"").trim().length)
    ));
    let bestColumns=1;
    let bestScore=-Infinity;
    const maximumColumns=Math.min(Math.max(1,regularCount),8);
    for(let columns=1;columns<=maximumColumns;columns++){
      const regularRows=Math.max(1,Math.ceil(regularCount/columns));
      const rows=regularRows+1;
      const cellWidth=(width-gap*(columns-1))/columns;
      const cellHeight=(height-gap*(rows-1))/rows;
      if(cellWidth<24||cellHeight<20)continue;
      const estimatedFont=Math.min(cellHeight*.74,cellWidth/(Math.max(4,longestWord)*.56));
      const balancePenalty=Math.abs((cellWidth/cellHeight)-1.55)*.05;
      const score=estimatedFont-balancePenalty;
      if(score>bestScore){
        bestScore=score;
        bestColumns=columns;
      }
    }
    syncPaintSpecialToolOrder(bestColumns);
    const fittedControls=paintToolControls();
    const regularRows=Math.max(1,Math.ceil(Math.max(0,fittedControls.length-1)/bestColumns));
    const rows=regularRows+1;
    paintToolbarGroups.style.gridTemplateColumns=`repeat(${bestColumns},minmax(0,1fr))`;
    paintToolbarGroups.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;
    fittedControls.forEach(control=>{
      control.style.removeProperty("--paint-control-font-size");
      control.style.removeProperty("grid-column");
      const label=control.querySelector(".paint-tool-field-label");
      if(label)label.style.removeProperty("font-size");
    });
    if(fittedControls.length)fittedControls[0].style.gridColumn="1/-1";
    fittedControls.forEach(fitPaintControlText);
  });
}
function startPaintSplitDrag(event){
  /* Touch/pen pointer events may report a non-mouse button value. */
  if(event.pointerType==="mouse"&&event.button!==0)return;

  event.preventDefault();
  event.stopPropagation();

  paintSplitDragState={
    pointerId:event.pointerId,
    workspaceRect:paintWorkspace.getBoundingClientRect()
  };

  paintSplitDivider.setPointerCapture(event.pointerId);
  paintSplitDivider.classList.add("dragging");
}

function movePaintSplitDrag(event){
  if(!paintSplitDragState)return;
  if(event.pointerId!==paintSplitDragState.pointerId)return;

  event.preventDefault();

  const rect=paintSplitDragState.workspaceRect;
  const axis=isPaintStackedLayout()
    ?rect.height
    :rect.width;
  const position=isPaintStackedLayout()
    ?event.clientY-rect.top
    :event.clientX-rect.left;

  applyPaintSplit(
    snapPaintSplit(position)/Math.max(1,axis),
    false
  );
}

function finishPaintSplitDrag(event){
  if(!paintSplitDragState)return;

  if(
    event&&
    event.pointerId!==undefined&&
    event.pointerId!==paintSplitDragState.pointerId
  ){
    return;
  }

  const axis=Math.max(1,paintSplitAxisSize());
  const raw=getComputedStyle(
    paintWorkspace
  ).getPropertyValue(
    "--paint-tools-px"
  ).trim();
  const pixels=parseFloat(raw)||axis*.42;

  paintSplitDragState=null;
  paintSplitDivider.classList.remove("dragging");
  savePaintSplit(pixels/axis);
  fitPaintToolbar();
  resizeFabricCanvas();
}
function ensureFabricCanvas(){
  if(fabricCanvas)return true;

  if(
    !window.fabric||
    typeof window.fabric.Canvas!=="function"
  ){
    showToast("PAINT LIBRARY NOT LOADED");
    return false;
  }

  const initialWidth=Math.max(
    180,
    Math.floor(paintCanvasStage.clientWidth||1200)
  );
  const initialHeight=Math.max(
    140,
    Math.floor(paintCanvasStage.clientHeight||800)
  );

  fabricCanvas=new fabric.Canvas(
    "paintCanvas",
    {
      width:initialWidth,
      height:initialHeight,
      backgroundColor:"#ffffff",
      preserveObjectStacking:true,
      selection:true,
      centeredScaling:false,
      controlsAboveOverlay:true
    }
  );

  fabric.Object.prototype.transparentCorners=false;
  fabric.Object.prototype.cornerStyle="rect";
  fabric.Object.prototype.cornerColor="#5b8def";
  fabric.Object.prototype.cornerStrokeColor="#660099";
  fabric.Object.prototype.borderColor="#660099";
  fabric.Object.prototype.cornerSize=16;
  fabric.Object.prototype.padding=0;

  fabricCanvas.on(
    "object:added",
    queuePaintHistory
  );
  const constrainPaintInteraction=event=>{
    if(!event||!event.target)return;

    clampPaintObject(event.target);
    fabricCanvas.requestRenderAll();
  };

  fabricCanvas.on(
    "object:moving",
    constrainPaintInteraction
  );
  fabricCanvas.on(
    "object:scaling",
    constrainPaintInteraction
  );
  fabricCanvas.on(
    "object:rotating",
    constrainPaintInteraction
  );
  fabricCanvas.on(
    "object:modified",
    event=>{
      constrainPaintInteraction(event);
      queuePaintHistory();
    }
  );
  fabricCanvas.on(
    "object:removed",
    queuePaintHistory
  );
  fabricCanvas.on(
    "path:created",
    queuePaintHistory
  );
  fabricCanvas.on(
    "mouse:down",
    fillEnclosedPaintRegion
  );
  fabricCanvas.on(
    "selection:created",
    syncPaintControlsFromSelection
  );
  fabricCanvas.on(
    "selection:updated",
    syncPaintControlsFromSelection
  );

  paintTextSizeInput.value=String(
    Math.min(
      240,
      Math.max(8,Number(cfg.fontSize||13))
    )
  );

  setPaintMode("draw");
  resizeFabricCanvas();
  savePaintHistory(true);
  return true;
}

function resizeFabricCanvas(){
  if(!fabricCanvas)return;

  const width=Math.max(
    1,
    Math.floor(paintCanvasStage.clientWidth-2)
  );
  const height=Math.max(
    1,
    Math.floor(paintCanvasStage.clientHeight-2)
  );
  const oldWidth=Math.max(
    1,
    fabricCanvas.getWidth()
  );
  const oldHeight=Math.max(
    1,
    fabricCanvas.getHeight()
  );

  if(
    oldWidth!==width||
    oldHeight!==height
  ){
    const objects=fabricCanvas.getObjects();

    objects.forEach(object=>{
      object.set({
        left:(object.left||0)*(width/oldWidth),
        top:(object.top||0)*(height/oldHeight)
      });
      object.setCoords();
    });

    fabricCanvas.setDimensions({
      width,
      height
    });

    objects.forEach(object=>{
      clampPaintObject(object);
    });
  }else{
    fabricCanvas.setDimensions(
      {width,height},
      {cssOnly:true}
    );
  }

  const wrapper=fabricCanvas.wrapperEl;

  if(wrapper){
    wrapper.style.position="absolute";
    wrapper.style.inset="1px";
    wrapper.style.width="calc(100% - 2px)";
    wrapper.style.height="calc(100% - 2px)";
    wrapper.style.maxWidth="calc(100% - 2px)";
    wrapper.style.maxHeight="calc(100% - 2px)";
    wrapper.style.boxSizing="border-box";
    wrapper.style.overflow="hidden";
  }

  fabricCanvas.calcOffset();
  fabricCanvas.requestRenderAll();
}

let paintSpecialToolOrderMode="";
let paintStoredNonSpecialToolOrder=null;

function paintToolControlKey(control){
  if(!control)return"";
  if(control.id)return control.id;
  const nested=control.querySelector("input[id],select[id],button[id]");
  return nested?nested.id:"";
}
function paintToolControls(){
  return [...paintToolbarGroups.children].filter(control=>
    control instanceof Element&&
    !control.hidden&&
    control.id!=="paintTextSizeInput"
  );
}
function paintCurrentToolOrder(){
  return paintToolControls().map(paintToolControlKey).filter(Boolean);
}
function applyPaintToolOrder(order){
  const controls=new Map(paintToolControls().map(control=>[paintToolControlKey(control),control]));
  const used=new Set();
  order.forEach(key=>{
    const control=controls.get(key);
    if(!control||used.has(key))return;
    paintToolbarGroups.append(control);
    used.add(key);
  });
  controls.forEach((control,key)=>{
    if(!used.has(key))paintToolbarGroups.append(control);
  });
}
function paintSpecialToolModeFor(bestColumns){
  if(window.matchMedia("(min-width:821px)").matches){
    if(bestColumns===1)return"desktop-one";
    if(bestColumns===2)return"desktop-two";
    if(bestColumns===3)return"desktop-three";
  }
  if(isPaintMobileLandscape()){
    if(bestColumns===2)return"mobile-two";
    if(bestColumns===3)return"mobile-three";
    if(bestColumns===4)return"mobile-four";
  }
  if(isPaintStackedLayout()){
    if(bestColumns===2)return"mobile-portrait-two";
    if(bestColumns===3)return"mobile-portrait-three";
    if(bestColumns===4)return"mobile-portrait-four";
  }
  return"";
}
function syncPaintSpecialToolOrder(bestColumns){
  const nextMode=paintSpecialToolModeFor(bestColumns);
  const current=paintCurrentToolOrder();
  if(!current.length)return;
  if(nextMode===paintSpecialToolOrderMode)return;

  if(paintSpecialToolOrderMode){
    const restore=(Array.isArray(paintStoredNonSpecialToolOrder)&&paintStoredNonSpecialToolOrder.length
      ?paintStoredNonSpecialToolOrder
      :current
    ).filter((key,index,array)=>array.indexOf(key)===index);
    const desired=restore.filter(key=>current.includes(key)).concat(
      current.filter(key=>!restore.includes(key))
    );
    if(JSON.stringify(current)!==JSON.stringify(desired))applyPaintToolOrder(desired);
    paintSpecialToolOrderMode="";
    paintStoredNonSpecialToolOrder=null;
  }

  if(!nextMode)return;

  const regularOrder=paintCurrentToolOrder();
  paintStoredNonSpecialToolOrder=regularOrder.slice();
  let preferred;
  if(nextMode==="mobile-two"){
    preferred=PAINT_MOBILE_LANDSCAPE_TWO_COLUMN_ORDER;
  }else if(nextMode==="mobile-three"){
    preferred=PAINT_MOBILE_LANDSCAPE_THREE_COLUMN_ORDER;
  }else if(nextMode==="mobile-four"){
    preferred=PAINT_MOBILE_LANDSCAPE_FOUR_COLUMN_ORDER;
  }else if(nextMode==="mobile-portrait-two"){
    preferred=PAINT_MOBILE_PORTRAIT_TWO_COLUMN_ORDER;
  }else if(nextMode==="mobile-portrait-three"){
    preferred=PAINT_MOBILE_PORTRAIT_THREE_COLUMN_ORDER;
  }else if(nextMode==="mobile-portrait-four"){
    preferred=PAINT_MOBILE_PORTRAIT_FOUR_COLUMN_ORDER;
  }else if(nextMode==="desktop-two"){
    preferred=PAINT_DESKTOP_TWO_COLUMN_ORDER;
  }else if(nextMode==="desktop-three"){
    preferred=PAINT_DESKTOP_THREE_COLUMN_ORDER;
  }else{
    preferred=PAINT_DESKTOP_ONE_COLUMN_ORDER;
  }
  const desired=preferred.filter(key=>regularOrder.includes(key)).concat(
    regularOrder.filter(key=>!preferred.includes(key))
  );
  if(JSON.stringify(regularOrder)!==JSON.stringify(desired))applyPaintToolOrder(desired);
  paintSpecialToolOrderMode=nextMode;
}

function paintHexToRgba(hex){
  const value=String(hex||"#000000").replace("#","");
  const normalized=value.length===3?value.split("").map(character=>character+character).join(""):value.padEnd(6,"0").slice(0,6);
  return{
    r:parseInt(normalized.slice(0,2),16)||0,
    g:parseInt(normalized.slice(2,4),16)||0,
    b:parseInt(normalized.slice(4,6),16)||0,
    a:255
  };
}
function paintPixelsMatch(data,offset,seed,tolerance){
  return Math.abs(data[offset]-seed.r)<=tolerance&&
    Math.abs(data[offset+1]-seed.g)<=tolerance&&
    Math.abs(data[offset+2]-seed.b)<=tolerance&&
    Math.abs(data[offset+3]-seed.a)<=tolerance;
}
function fillEnclosedPaintRegion(options){
  if(!fabricCanvas||paintMode!=="fill"||!options||!options.e)return;
  options.e.preventDefault&&options.e.preventDefault();
  fabricCanvas.discardActiveObject();
  fabricCanvas.requestRenderAll();

  let sourceCanvas=null;
  try{
    sourceCanvas=fabricCanvas.toCanvasElement(1,{
      left:0,
      top:0,
      width:fabricCanvas.getWidth(),
      height:fabricCanvas.getHeight()
    });
  }catch(_){sourceCanvas=fabricCanvas.lowerCanvasEl;}
  if(!sourceCanvas)return;

  const width=Math.max(1,sourceCanvas.width|0);
  const height=Math.max(1,sourceCanvas.height|0);
  const pointer=fabricCanvas.getPointer(options.e);
  const scaleX=width/Math.max(1,fabricCanvas.getWidth());
  const scaleY=height/Math.max(1,fabricCanvas.getHeight());
  const startX=Math.max(0,Math.min(width-1,Math.floor(pointer.x*scaleX)));
  const startY=Math.max(0,Math.min(height-1,Math.floor(pointer.y*scaleY)));
  const context=sourceCanvas.getContext("2d",{willReadFrequently:true});
  if(!context)return;

  let sourceImage;
  try{sourceImage=context.getImageData(0,0,width,height);}catch(_){showToast("FILL NOT AVAILABLE");return;}
  const data=sourceImage.data;
  const startIndex=(startY*width)+startX;
  const startOffset=startIndex*4;
  const seed={r:data[startOffset],g:data[startOffset+1],b:data[startOffset+2],a:data[startOffset+3]};
  const tolerance=22;
  const visited=new Uint8Array(width*height);
  const stack=new Int32Array(width*height);
  const region=new Int32Array(width*height);
  let stackSize=0;
  let regionSize=0;
  let touchesEdge=false;
  visited[startIndex]=1;
  stack[stackSize++]=startIndex;

  while(stackSize){
    const index=stack[--stackSize];
    const offset=index*4;
    if(!paintPixelsMatch(data,offset,seed,tolerance))continue;
    const x=index%width;
    const y=(index/width)|0;
    region[regionSize++]=index;
    if(x===0||y===0||x===width-1||y===height-1)touchesEdge=true;
    if(x>0&&!visited[index-1]){visited[index-1]=1;stack[stackSize++]=index-1;}
    if(x<width-1&&!visited[index+1]){visited[index+1]=1;stack[stackSize++]=index+1;}
    if(y>0&&!visited[index-width]){visited[index-width]=1;stack[stackSize++]=index-width;}
    if(y<height-1&&!visited[index+width]){visited[index+width]=1;stack[stackSize++]=index+width;}
  }

  if(touchesEdge||regionSize<2||regionSize>width*height*.92){
    const canvasColor=paintColorInput.value||"#000000";
    fabricCanvas.setBackgroundColor(canvasColor,()=>{
      fabricCanvas.discardActiveObject();
      fabricCanvas.requestRenderAll();
      savePaintHistory();
    });
    showToast("CANVAS FILLED");
    return;
  }

  const fillColor=paintHexToRgba(paintColorInput.value);
  const maskCanvas=document.createElement("canvas");
  maskCanvas.width=width;
  maskCanvas.height=height;
  const maskContext=maskCanvas.getContext("2d");
  const maskImage=maskContext.createImageData(width,height);
  const maskData=maskImage.data;
  const filledPixels=new Uint8Array(width*height);
  for(let position=0;position<regionSize;position++){
    const index=region[position];
    const x=index%width;
    const y=(index/width)|0;
    for(let offsetY=-1;offsetY<=1;offsetY++){
      const nextY=y+offsetY;
      if(nextY<0||nextY>=height)continue;
      for(let offsetX=-1;offsetX<=1;offsetX++){
        const nextX=x+offsetX;
        if(nextX<0||nextX>=width)continue;
        filledPixels[(nextY*width)+nextX]=1;
      }
    }
  }
  for(let index=0;index<filledPixels.length;index++){
    if(!filledPixels[index])continue;
    const offset=index*4;
    maskData[offset]=fillColor.r;
    maskData[offset+1]=fillColor.g;
    maskData[offset+2]=fillColor.b;
    maskData[offset+3]=255;
  }
  maskContext.putImageData(maskImage,0,0);

  const image=new fabric.Image(maskCanvas,{
    left:0,
    top:0,
    originX:"left",
    originY:"top",
    scaleX:1/scaleX,
    scaleY:1/scaleY,
    selectable:false,
    evented:false,
    objectCaching:false,
    paintFillRegion:true
  });
  const fillLayerCount=fabricCanvas.getObjects().filter(object=>object.paintFillRegion).length;
  fabricCanvas.add(image);
  fabricCanvas.moveTo(image,fillLayerCount);
  fabricCanvas.requestRenderAll();
  savePaintHistory();
}

function addPaintImageFile(file){

    fabric.Image.fromURL(
      reader.result,
      image=>{
        const maxWidth=Math.max(
          1,
          fabricCanvas.getWidth()
        );
        const maxHeight=Math.max(
          1,
          fabricCanvas.getHeight()
        );
        const scale=Math.min(
          1,
          maxWidth/Math.max(1,image.width||1),

        image.set({
          left:fabricCanvas.getWidth()/2,
          top:fabricCanvas.getHeight()/2,
          originX:"center",
          originY:"center",
          scaleX:scale,
          scaleY:scale

        fabricCanvas.add(image);
        clampPaintObject(image);

function pastePaintClipboardObject(source){
  if(!fabricCanvas||!source)return;
  source.clone(clone=>{
    fabricCanvas.discardActiveObject();
    paintClipboardPasteOffset=(paintClipboardPasteOffset+1)%8;
    const offset=24*Math.max(1,paintClipboardPasteOffset);
    clone.set({
      left:(clone.left||0)+offset,
      top:(clone.top||0)+offset,
      evented:true,
      selectable:true
    });
    if(clone.type==="activeSelection"){
      clone.canvas=fabricCanvas;
      clone.forEachObject(object=>{
        object.evented=true;
        object.selectable=true;
        fabricCanvas.add(object);
      });
      clone.setCoords();
    }else{
      fabricCanvas.add(clone);
    }
    paintClipboard=source;
    fabricCanvas.setActiveObject(clone);
    clampPaintObject(clone);
    fabricCanvas.requestRenderAll();
    savePaintHistory();
  });
}

let languageSelectFitFrame=0;
function fitSelectedLanguageText(){
  cancelAnimationFrame(languageSelectFitFrame);
  languageSelectFitFrame=requestAnimationFrame(()=>{
    languageSelectFitFrame=0;
    if(!languageSelect)return;
    const text=String(LANGUAGE_NAMES[language]||language||"").trim();
    const target=languageSelectedDisplay||languageSelect;
    const width=target.clientWidth;
    const height=target.clientHeight;
    if(!text||width<12||height<12)return;

    const canvas=fitSelectedLanguageText.canvas||(fitSelectedLanguageText.canvas=document.createElement("canvas"));
    const context=canvas.getContext("2d");
    if(!context)return;

    const style=getComputedStyle(target);
    const paddingLeft=parseFloat(style.paddingLeft)||0;
    const paddingRight=parseFloat(style.paddingRight)||0;
    const paddingTop=parseFloat(style.paddingTop)||0;
    const paddingBottom=parseFloat(style.paddingBottom)||0;
    const availableWidth=Math.max(8,width-paddingLeft-paddingRight-2);
    const availableHeight=Math.max(8,height-paddingTop-paddingBottom-4);
    const lineHeightRatio=1.12;
    let low=8;
    let high=Math.max(low,Math.floor(availableHeight/lineHeightRatio));
    let best=low;

    while(low<=high){
      const size=Math.floor((low+high)/2);
      context.font=`900 ${size}px Arial,Helvetica,sans-serif`;
      const metrics=context.measureText(text);
      const glyphHeight=(metrics.actualBoundingBoxAscent||size*.78)+(metrics.actualBoundingBoxDescent||size*.22);
      const lineBoxHeight=size*lineHeightRatio;
      if(metrics.width<=availableWidth&&Math.max(glyphHeight,lineBoxHeight)<=availableHeight){
        best=size;
        low=size+1;
      }else{
        high=size-1;
      }
    }

    languageSelect.style.setProperty("--language-selected-font-size",best+"px");
    if(languageSelectedDisplay){
      languageSelectedDisplay.style.setProperty("--language-selected-font-size",best+"px");
    }
  });
}

function digitsOnly(value){
  return String(value||"").replace(/\D/g,"").slice(0,4);
}

function normalizeTextNumber(value){
  const raw=String(value||"").trim();
  const digits=raw.replace(/\D/g,"");
  if(!digits)return "";
  if(raw.startsWith("+"))return "+"+digits;
  if(digits.length===10)return "+1"+digits;
  if(digits.length===11&&digits.startsWith("1"))return "+"+digits;
  return "+"+digits;
}

function formatTextNumber(value){
  const normalized=normalizeTextNumber(value);
  const digits=normalized.replace(/\D/g,"");
  if(digits.length===11&&digits.startsWith("1")){
    return `${digits.slice(1,4)} ${digits.slice(4,7)} ${digits.slice(7)}`;
  }
  if(digits.length===10){
    return `${digits.slice(0,3)} ${digits.slice(3,6)} ${digits.slice(6)}`;
  }
  return normalized||"";
}

function normalizeCubeSpans(value){
  const result={};
  if(!value||typeof value!=="object"||Array.isArray(value))return result;
  Object.entries(value).forEach(([key,span])=>{
    if(!key||!span||typeof span!=="object")return;
    const rawCols=Number(span.cols||span.columns||1);
    const cols=Math.min(6,Math.max(1,Math.round(rawCols)));
    const rows=Number(span.rows||span.rowSpan||1)>=2?2:1;
    if(cols>1||rows>1)result[String(key)]={cols,rows};
  });
  return result;
}

function cubeSpanForTarget(target){
  const span=cubeSpans[String(target||"")]||{};
  const rawCols=Number(span.cols);
  const cols=Math.min(6,Math.max(1,Math.round(rawCols||1)));
  const rows=Number(span.rows)>=2?2:1;
  return{cols,rows};
}

function applyCubeSpanToElement(element,target){
  if(!element)return;
  const span=cubeSpanForTarget(target);
  element.dataset.spanCols=String(span.cols);
  element.dataset.spanRows=String(span.rows);
  element.style.gridColumn=`span ${span.cols}`;
  element.style.gridRow=`span ${span.rows}`;
}

function layoutKeyForUrl(url){
  let hash=2166136261;
  const text=String(url||"");
  for(let index=0;index<text.length;index++){
    hash^=text.charCodeAt(index);
    hash=Math.imul(hash,16777619);
  }
  return"link-"+(hash>>>0).toString(36);
}

const SITE_GRID_FILLER_PREFIX="empty-cube-";
let siteGridFillerSerial=0;

function isSiteGridFillerKey(key){
  return String(key||"").startsWith(SITE_GRID_FILLER_PREFIX);

function isSiteGridFiller(item){

function nextSiteGridFillerKey(existingKeys=[]){
  const used=new Set(existingKeys.map(String));
  let key="";
  do{
    siteGridFillerSerial+=1;
    key=SITE_GRID_FILLER_PREFIX+siteGridFillerSerial;

  return key;
}

let siteGridTextFitFrame=0;
function fitSiteGridTextControl(control,maxSize=160,minSize=5){
  if(!control||control.offsetWidth<8||control.offsetHeight<8)return;
  const text=String(control.textContent||"").trim();
  if(!text)return;
  const style=getComputedStyle(control);
  const availableWidth=Math.max(4,control.clientWidth-(parseFloat(style.paddingLeft)||0)-(parseFloat(style.paddingRight)||0)-2);
  const availableHeight=Math.max(4,control.clientHeight-(parseFloat(style.paddingTop)||0)-(parseFloat(style.paddingBottom)||0)-2);
  const mirror=document.createElement("div");
  Object.assign(mirror.style,{
    position:"fixed",left:"-10000px",top:"-10000px",visibility:"hidden",pointerEvents:"none",
    width:availableWidth+"px",maxWidth:availableWidth+"px",margin:"0",padding:"0",border:"0",
    fontFamily:style.fontFamily||"Arial",fontWeight:"900",fontStyle:style.fontStyle||"normal",
    lineHeight:"1.04",letterSpacing:style.letterSpacing||"normal",textTransform:style.textTransform||"none",
    whiteSpace:"normal",overflowWrap:"normal",wordBreak:"keep-all",hyphens:"none",textAlign:"center"
  });
  mirror.textContent=text;
  document.body.append(mirror);
  let low=minSize;
  let high=Math.max(minSize,Math.min(maxSize,Math.floor(availableHeight)));
  let best=minSize;
  while(low<=high){
    const size=Math.floor((low+high)/2);
    mirror.style.fontSize=size+"px";
    const fits=mirror.scrollWidth<=availableWidth+1&&mirror.scrollHeight<=availableHeight+1;
    if(fits){best=size;low=size+1;}else high=size-1;
  }
  mirror.remove();
  control.style.setProperty("font-size",best+"px","important");
}

function siteGridItemSpan(item){
  return{
    cols:Math.min(6,Math.max(1,Math.round(Number(item&&item.dataset&&item.dataset.spanCols)||1))),
    rows:Number(item&&item.dataset&&item.dataset.spanRows)>=2?2:1
  };
}

function packedRowsForColumns(items,columns){
  const occupancy=[];
  let usedRows=0;
  const canPlace=(row,column,rows,cols)=>{
    if(column+cols>columns)return false;
    for(let r=row;r<row+rows;r++){
      for(let c=column;c<column+cols;c++){
        if(occupancy[r]&&occupancy[r][c])return false;
      }
    }
    return true;
  };
  const place=(row,column,rows,cols)=>{
    for(let r=row;r<row+rows;r++){
      if(!occupancy[r])occupancy[r]=Array(columns).fill(false);
      for(let c=column;c<column+cols;c++)occupancy[r][c]=true;
    }
    usedRows=Math.max(usedRows,row+rows);
  };
  for(const item of items){
    const span=siteGridItemSpan(item);
    if(span.cols>columns)return Infinity;
    let placed=false;
    for(let row=0;!placed;row++){
      for(let column=0;column<=columns-span.cols;column++){
        if(!canPlace(row,column,span.rows,span.cols))continue;
        place(row,column,span.rows,span.cols);
        placed=true;
        break;
      }
    }
  }
  return Math.max(1,usedRows);
}

function fitSiteGrid(){
  const existingFillers=siteGridItems().filter(isSiteGridFiller);
  const items=siteGridItems().filter(item=>!isSiteGridFiller(item));
  const count=items.length;
  const viewportWidth=Math.max(1,window.innerWidth||document.documentElement.clientWidth||grid.clientWidth);
  const height=Math.max(1,grid.clientHeight||window.innerHeight);
  existingFillers.forEach(item=>item.remove());
  if(!count)return;
  const gap=5;
  const targetRatio=1.8;
  const menuOpen=Boolean(devUnlocked);
  const totalArea=items.reduce((sum,item)=>{const span=siteGridItemSpan(item);return sum+(span.cols*span.rows);},0);
  const widest=items.reduce((max,item)=>Math.max(max,siteGridItemSpan(item).cols),1);
  let bestColumns=widest;
  let bestRows=packedRowsForColumns(items,bestColumns);
  let bestCellWidth=viewportWidth/Math.max(1,bestColumns+(menuOpen?1:0));
  let bestScore=Infinity;
  const maxColumns=Math.min(Math.max(widest,totalArea),10);
  const profileColumns=Math.min(10,Math.max(widest,Number(
    deviceLayouts[activeDeviceLayoutKey]&&deviceLayouts[activeDeviceLayoutKey].columns||0
  )));
  if(profileColumns>=widest){
    bestColumns=profileColumns;
    bestRows=packedRowsForColumns(items,bestColumns);
    const divisor=menuOpen?bestColumns+1:bestColumns;
    bestCellWidth=(viewportWidth-gap*Math.max(0,bestColumns-1))/Math.max(1,divisor);
    bestScore=0;
  }else{
    for(let columns=widest;columns<=maxColumns;columns++){
      const rows=packedRowsForColumns(items,columns);
      if(!Number.isFinite(rows))continue;
      const divisor=menuOpen?columns+1:columns;
      const cellWidth=(viewportWidth-gap*Math.max(0,columns-1))/divisor;
      const cellHeight=(height-gap*Math.max(0,rows-1))/rows;
      if(cellWidth<54||cellHeight<34)continue;
      const ratio=cellWidth/Math.max(1,cellHeight);
      const emptySlots=Math.max(0,(columns*rows)-totalArea);
      const score=Math.abs(Math.log(Math.max(.01,ratio/targetRatio)))+(emptySlots/Math.max(1,totalArea))*.08;
      if(score<bestScore){
        bestScore=score;
        bestColumns=columns;
        bestRows=rows;
        bestCellWidth=cellWidth;
      }
    }
  }
  if(!Number.isFinite(bestScore)){
    bestColumns=widest;
    bestRows=packedRowsForColumns(items,bestColumns);
    bestCellWidth=viewportWidth/Math.max(1,bestColumns+(menuOpen?1:0));
  }
  if(menuOpen){
    const menuWidth=Math.max(1,bestCellWidth);
    document.documentElement.style.setProperty("--dev-menu-width",`${menuWidth}px`);
    grid.style.width=`calc(100dvw - ${menuWidth}px)`;
    grid.style.maxWidth=`calc(100dvw - ${menuWidth}px)`;
  }else{
    grid.style.width="100%";
    grid.style.maxWidth="100%";
  }
  grid.style.gridTemplateColumns=`repeat(${bestColumns},minmax(0,1fr))`;
  grid.style.gridTemplateRows=`repeat(${bestRows},minmax(0,1fr))`;
  const fillerCount=Math.max(0,(bestColumns*bestRows)-totalArea);
  const rememberedKeys=[
    ...siteGridOrder.filter(isSiteGridFillerKey),
    ...existingFillers.map(item=>String(item.dataset.siteGridKey||"")).filter(Boolean)
  ].filter((key,index,array)=>key&&array.indexOf(key)===index);
  while(rememberedKeys.length<fillerCount){
    rememberedKeys.push(nextSiteGridFillerKey(rememberedKeys));
  }
  const fillers=rememberedKeys.slice(0,fillerCount).map(createSiteGridFiller);
  const orderedItems=applySiteGridOrder([...items,...fillers]);
  grid.replaceChildren(...orderedItems);
  fitSiteGridTextControls();
  requestAnimationFrame(syncDevMenuDimensions);
}

function applySiteGridOrder(items,preserveMissingFillers=false){
  const previousOrder=[...siteGridOrder];
  const itemMap=new Map(items.map(item=>[String(item.dataset.siteGridKey||""),item]));
  const used=new Set();
  const ordered=[];
  previousOrder.forEach(key=>{
    const item=itemMap.get(String(key));
    if(!item||used.has(String(key)))return;
    ordered.push(item);
    used.add(String(key));
  });
  items.forEach(item=>{
    const key=String(item.dataset.siteGridKey||"");
    if(!key||used.has(key))return;
    ordered.push(item);
    used.add(key);
  });
  const orderedKeys=ordered.map(item=>String(item.dataset.siteGridKey||"")).filter(Boolean);
  if(preserveMissingFillers){
    const liveKeys=new Set(orderedKeys);
    const preserved=[];
    previousOrder.forEach(key=>{
      const normalized=String(key||"");
      if(!normalized)return;
      if(isSiteGridFillerKey(normalized)||liveKeys.has(normalized)){
        if(!preserved.includes(normalized))preserved.push(normalized);
      }
    });
    orderedKeys.forEach(key=>{if(!preserved.includes(key))preserved.push(key);});
    siteGridOrder=preserved;
  }else{
    siteGridOrder=orderedKeys;
  }
  return ordered;
}

function beginSiteGridDragging(state){
  if(!state||state.dragging)return;
  state.dragging=true;
  suppressSiteGridClick=true;
  const rect=state.item.getBoundingClientRect();
  state.offsetX=state.startX-rect.left;
  state.offsetY=state.startY-rect.top;
  state.ghost=state.item.cloneNode(true);
  state.ghost.removeAttribute("id");
  state.ghost.querySelectorAll("[id]").forEach(node=>node.removeAttribute("id"));
  state.ghost.classList.remove("site-grid-drag-source");
  state.ghost.classList.add("site-grid-drag-ghost");
  state.ghost.querySelectorAll("input,select,button,a").forEach(node=>{
    node.tabIndex=-1;
    node.style.pointerEvents="none";
  });
  state.ghost.style.setProperty("--site-drag-width",rect.width+"px");
  state.ghost.style.setProperty("--site-drag-height",rect.height+"px");
  state.ghost.style.setProperty("left",rect.left+"px","important");
  state.ghost.style.setProperty("top",rect.top+"px","important");
  state.ghost.style.setProperty("width",rect.width+"px","important");
  state.ghost.style.setProperty("min-width",rect.width+"px","important");
  state.ghost.style.setProperty("max-width",rect.width+"px","important");
  state.ghost.style.setProperty("height",rect.height+"px","important");
  state.ghost.style.setProperty("min-height",rect.height+"px","important");
  state.ghost.style.setProperty("max-height",rect.height+"px","important");
  document.body.append(state.ghost);
  state.item.classList.add("site-grid-drag-source");
  document.body.classList.add("site-grid-drag-active");
}

function startSiteGridDrag(event){
  if(!dragEnabled)return;
  if(event.pointerType==="mouse"&&event.button!==0)return;
  const item=event.target instanceof Element?event.target.closest("[data-site-grid-key]"):null;
  if(!item||item.parentElement!==grid)return;
  event.preventDefault();
  event.stopPropagation();
  siteGridDragState={
    item,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,
    dragging:false,touch:event.pointerType!=="mouse",longPressTimer:0,offsetX:0,offsetY:0,ghost:null,dropTarget:null
  };
  try{grid.setPointerCapture(event.pointerId);}catch(_){}
}

function swapSiteGridItems(first,second){
  if(!first||!second||first===second||first.parentElement!==grid||second.parentElement!==grid)return;
  const marker=document.createComment("site-grid-swap");
  grid.insertBefore(marker,first);
  grid.insertBefore(first,second);
  grid.insertBefore(second,marker);
  marker.remove();
}

function animateSiteGridPush(first,second){
  const items=siteGridItems();
  const before=new Map(items.map(item=>[item,item.getBoundingClientRect()]));
  swapSiteGridItems(first,second);
  items.forEach(item=>{
    const start=before.get(item);
    if(!start)return;
    const end=item.getBoundingClientRect();
    const dx=start.left-end.left;
    const dy=start.top-end.top;
    if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;
    item.classList.add("site-grid-pushing");
    if(typeof item.animate==="function"){
      const animation=item.animate(
        [
          {transform:`translate3d(${dx}px,${dy}px,0)`},
          {transform:"translate3d(0,0,0)"}
        ],
        {duration:180,easing:"cubic-bezier(.2,.8,.2,1)"}
      );
      animation.addEventListener("finish",()=>item.classList.remove("site-grid-pushing"),{once:true});
      animation.addEventListener("cancel",()=>item.classList.remove("site-grid-pushing"),{once:true});
    }else{
      item.classList.remove("site-grid-pushing");
    }
  });
}

function siteGridSwapTarget(clientX,clientY,dragged){
  const gridRect=grid.getBoundingClientRect();
  if(clientX<gridRect.left||clientX>gridRect.right||clientY<gridRect.top||clientY>gridRect.bottom)return null;
  if(dragged){
    const draggedRect=dragged.getBoundingClientRect();
    if(clientX>=draggedRect.left&&clientX<=draggedRect.right&&clientY>=draggedRect.top&&clientY<=draggedRect.bottom)return null;
  }
  const element=document.elementFromPoint(clientX,clientY);
  const direct=element instanceof Element?element.closest("[data-site-grid-key]"):null;
  if(direct&&direct!==dragged&&direct.parentElement===grid)return direct;
  const candidates=siteGridItems().filter(item=>item!==dragged);
  for(const item of candidates){
    const rect=item.getBoundingClientRect();
    if(clientX>=rect.left&&clientX<=rect.right&&clientY>=rect.top&&clientY<=rect.bottom)return item;
  }
  return null;
}

function moveSiteGridDrag(event){
  const state=siteGridDragState;
  if(!state||event.pointerId!==state.pointerId)return;
  const distance=Math.hypot(event.clientX-state.startX,event.clientY-state.startY);
  if(!state.dragging){
    if(distance<3)return;
    beginSiteGridDragging(state);
  }
  event.preventDefault();
  event.stopPropagation();
  if(state.ghost){
    state.ghost.style.left=(event.clientX-state.offsetX)+"px";
    state.ghost.style.top=(event.clientY-state.offsetY)+"px";
    state.ghost.style.transform="none";
  }
  const target=siteGridSwapTarget(event.clientX,event.clientY,state.item);
  if(target&&target!==state.dropTarget){
    state.dropTarget=target;
    animateSiteGridPush(state.item,target);
  }else if(!target){
    state.dropTarget=null;
  }
}

function finishSiteGridDrag(event){
  const state=siteGridDragState;
  if(!state){
    document.body.classList.remove("site-grid-drag-active");
    return;
  }
  if(event&&event.pointerId!==undefined&&event.pointerId!==state.pointerId)return;
  if(state.longPressTimer)clearTimeout(state.longPressTimer);
  const dragged=state.dragging;
  state.item.classList.remove("site-grid-drag-source");
  if(state.ghost)state.ghost.remove();
  try{if(event&&grid.hasPointerCapture(event.pointerId))grid.releasePointerCapture(event.pointerId);}catch(_){}
  document.body.classList.remove("site-grid-drag-active");
  siteGridDragState=null;
  if(dragged){
    // Capture the dropped DOM order before fitSiteGrid rebuilds the grid.
    // This keeps normal and blank cubes in their new positions after drop.
    siteGridOrder=currentSiteGridOrder();
    syncActiveDeviceLayoutFromState(true);
    cfg.deviceLayouts=normalizeDeviceLayouts(deviceLayouts);
    cfg.siteGridOrder=[...siteGridOrder];
    fitSiteGrid();
    saveSiteGridOrder("SAVED");
  }
  setTimeout(()=>{suppressSiteGridClick=false;},180);
}

function normalizeUrl(value){
  const trimmed=String(value||"").trim();
  if(!trimmed)return "";

  try{
    return new URL(trimmed).href;
  }catch(_){}

  try{
    return new URL("https://"+trimmed).href;
  }catch(_){
    return "";
  }
}

function removeLinkByUrl(url){
  const normalized=String(url||"");
  if(!normalized)return;

  const customIndex=customLinks.findIndex(
    item=>String(item&&item.url||"")===normalized
  );

  if(customIndex>=0){
    customLinks.splice(customIndex,1);
    if(defaultLinks.some(item=>String(item&&item.url||"")===normalized)&&!hiddenLinks.includes(normalized)){
      hiddenLinks.push(normalized);
    }
  }else if(!hiddenLinks.includes(normalized)){
    hiddenLinks.push(normalized);
  }

  delete localRenames[normalized];
  delete remoteRenames[normalized];
  removeTargetFromAllDeviceLayouts(normalized);

  cfg.links=customLinks;
  cfg.hiddenLinks=[...new Set(hiddenLinks)];
  cfg.renames={...localRenames};
  cfg.paintButtonNames={...paintButtonNames};
  cfg.layout={};
  syncActiveDeviceLayoutFromState(false);
  cfg.deviceLayouts=normalizeDeviceLayouts(deviceLayouts);
  cfg.siteGridOrder=[...siteGridOrder];
  cfg.menuWidth=menuWidth;
  cfg.devCode=devCode;

  saveCfg("REMOVED");
  editJsonDirty=true;
  render();
  showEditLinkChoices();
}

function completeAddLinkUrl(value){
  const normalized=normalizeUrl(value);
  if(!normalized)return "";
  try{
    const parsed=new URL(normalized);
    const hostname=parsed.hostname;
    const completeHostname=hostname==="localhost"||hostname.includes(".")||/^\d{1,3}(?:\.\d{1,3}){3}$/.test(hostname)||hostname.includes(":");
    return /^(https?:)$/.test(parsed.protocol)&&completeHostname?parsed.href:"";
  }catch(_){
    return "";
  }
}

function commitNewLink(showErrors=true){
  const title=addLinkName.value.trim().toUpperCase();
  const url=completeAddLinkUrl(addLinkUrl.value);
  if(!title){
    if(showErrors){showToast("NAME REQUIRED");addLinkName.focus();}
    return false;
  }
  if(!url){
    if(showErrors){showToast("VALID URL REQUIRED");addLinkUrl.focus();}
    return false;
  }
  if(links().some(item=>String(item.url)===url)){
    if(showErrors){showToast("URL ALREADY EXISTS");addLinkUrl.focus();}
    return false;
  }
  const newItem={title,url,type:"WEB",group:"Custom"};
  customLinks.push(newItem);
  queueAllLinkTitleTranslations(title,newItem);
  cfg.links=customLinks;
  saveCfg("SAVED");
  render();
  return true;
}

function closeAddLinkModal(save=true){
  if(!addLinkModal)return true;
  const title=addLinkName.value.trim();
  const url=completeAddLinkUrl(addLinkUrl.value);
  const complete=Boolean(title&&url);
  if(save&&complete)commitNewLink(false);
  addLinkModal.classList.remove("open");
  addLinkName.value="";
  addLinkUrl.value="";
  return true;
}

function saveNewLink(){

}

function fitDevMenuButtonText(control,maxSize=44,minSize=5){
  if(!control||control.offsetWidth<4||control.offsetHeight<4)return;

  if(!text)return;
  const style=getComputedStyle(control);
  const availableWidth=Math.max(1,control.clientWidth-(parseFloat(style.paddingLeft)||0)-(parseFloat(style.paddingRight)||0));
  const availableHeight=Math.max(1,control.clientHeight-(parseFloat(style.paddingTop)||0)-(parseFloat(style.paddingBottom)||0));
  const mirror=document.createElement("div");
  Object.assign(mirror.style,{
    position:"fixed",left:"-10000px",top:"-10000px",visibility:"hidden",pointerEvents:"none",
    width:availableWidth+"px",maxWidth:availableWidth+"px",margin:"0",padding:"0",border:"0",
    fontFamily:style.fontFamily||"Arial",fontWeight:"900",fontStyle:style.fontStyle||"normal",
    lineHeight:"1.05",letterSpacing:style.letterSpacing||"normal",textTransform:style.textTransform||"none",
    whiteSpace:"normal",overflowWrap:"normal",wordBreak:"normal",hyphens:"none",textAlign:"center"
  });
  mirror.textContent=text;

  let low=minSize;
  let high=Math.max(minSize,Math.min(maxSize,Math.floor(availableHeight)));
  let best=minSize;
  while(low<=high){
    const size=Math.floor((low+high)/2);
    mirror.style.fontSize=size+"px";

      mirror.style.whiteSpace="nowrap";
      mirror.textContent=word;

    const fits=wordsFit&&mirror.scrollWidth<=availableWidth+1&&mirror.scrollHeight<=availableHeight+1;
    if(fits){best=size;low=size+1;}else high=size-1;
  }
  mirror.remove();
  control.style.fontSize=best+"px";
}

    fontFamily:style.fontFamily||"Arial",fontWeight:style.fontWeight||"900",fontStyle:style.fontStyle||"normal",
    lineHeight:"1.05",letterSpacing:style.letterSpacing||"normal",textTransform:style.textTransform||"none",
    whiteSpace:multiline?"pre-wrap":"nowrap",overflowWrap:multiline?"anywhere":"normal",wordBreak:multiline?"normal":"keep-all"
  });
  mirror.textContent=popupFitValue(control);
  document.body.append(mirror);
  let low=minSize;
  let high=maxSize;
  let best=minSize;
  while(low<=high){
    const size=Math.floor((low+high)/2);
    mirror.style.fontSize=size+"px";
    const fits=mirror.scrollWidth<=availableWidth+1&&mirror.scrollHeight<=availableHeight+1;
    if(fits){best=size;low=size+1;}else high=size-1;
  }
  mirror.remove();
  control.style.fontSize=best+"px";
}

function applyEditedLink(oldUrl,titleValue,urlValue,showErrors=false){
  oldUrl=String(oldUrl||"");
  const title=String(titleValue||"").trim().toUpperCase();
  const newUrl=normalizeUrl(urlValue);
  if(!title){
    if(showErrors)showToast("NAME REQUIRED");
    return{ok:false,reason:"name"};
  }
  if(!newUrl){
    if(showErrors)showToast("VALID URL REQUIRED");
    return{ok:false,reason:"url"};
  }
  const duplicate=[...defaultLinks,...customLinks].some(item=>
    String(item&&item.url||"")===newUrl&&String(item&&item.url||"")!==oldUrl
  );
  if(duplicate){
    if(showErrors)showToast("URL ALREADY EXISTS");
    return{ok:false,reason:"duplicate"};
  }
  const currentItem=englishLinks().find(item=>String(item.url)===oldUrl);
  const currentTitle=String(currentItem&&currentItem.title||"").trim().toUpperCase();
  if(newUrl===oldUrl&&title===currentTitle)return{ok:true,url:oldUrl,title,changed:false};
  const customIndex=customLinks.findIndex(item=>String(item&&item.url||"")===oldUrl);
  const originalDefault=defaultLinks.find(item=>String(item&&item.url||"")===oldUrl);
  delete localRenames[oldUrl];
  delete remoteRenames[oldUrl];
  hiddenLinks=hiddenLinks.filter(url=>String(url)!==newUrl);
  if(customIndex>=0){
    const updated={...customLinks[customIndex],title,url:newUrl};
    delete updated.i18nKey;
    customLinks[customIndex]=updated;
    localRenames[newUrl]=title;
  }else if(originalDefault&&newUrl===oldUrl){
    localRenames[oldUrl]=title;
  }else{
    if(!hiddenLinks.includes(oldUrl))hiddenLinks.push(oldUrl);
    customLinks.push({
      title,
      url:newUrl,
      type:originalDefault&&originalDefault.type?originalDefault.type:"WEB",
      group:originalDefault&&originalDefault.group?originalDefault.group:"Custom"
    });
    localRenames[newUrl]=title;
  }
  if(newUrl!==oldUrl){
    replaceTargetInAllDeviceLayouts(oldUrl,newUrl);
  }
  const stamp=Date.now();
  DEVICE_LAYOUT_KEYS.forEach(key=>{
    const profile=normalizeDeviceLayoutProfile(deviceLayouts[key],defaultDeviceLayouts()[key]);
    profile.titleOverrides={...profile.titleOverrides};
    delete profile.titleOverrides[oldUrl];
    profile.titleOverrides[newUrl]=title;
    profile.updatedAt=stamp;
    deviceLayouts[key]=profile;
  });
  loadActiveDeviceLayout(activeDeviceLayoutKey);
  return{ok:true,url:newUrl,title,changed:true};
}

function saveCurrentEditedLink(showErrors=false){
  clearTimeout(editAutoSaveTimer);
  editAutoSaveTimer=0;
  if(!editTargetUrl||editLinkForm.hidden)return true;
  if(editTargetUrl===PAINT_EDIT_KEY){
    const title=String(editLinkName.value||"").trim().toUpperCase();
    if(!title){
      if(showErrors){showToast("NAME REQUIRED");editLinkName.focus();}
      return false;
    }
    const previous=String(paintButtonNames.en||PAINT_I18N.en.paint||"PAINT").trim().toUpperCase();
    if(title!==previous){
      paintButtonNames.en=title;
      Object.keys(paintButtonNames).forEach(code=>{if(code!=="en")delete paintButtonNames[code];});
      cfg.paintButtonNames={...paintButtonNames};
      queueAllLinkTitleTranslations(title,{kind:"paint"});
      saveCfg("",false);
      editJsonDirty=true;
      applyPaintLanguage();
      render();
      const selected=selectedEditChoice();
      if(selected)selected.textContent=title;
    }
    return true;
  }
  const result=applyEditedLink(editTargetUrl,editLinkName.value,editLinkUrl.value,showErrors);
  if(!result.ok){
    if(showErrors)(result.reason==="name"?editLinkName:editLinkUrl).focus();
    return false;
  }
  if(result.changed){
    const selected=selectedEditChoice();
    editTargetUrl=result.url;
    if(selected){
      selected.dataset.url=result.url;
      selected.textContent=result.title;
      const row=selected.closest(".edit-link-choice-row");
      const remove=row&&row.querySelector(".edit-link-remove");
      const expand=row&&row.querySelector(".edit-link-expand");
      if(expand)expand.dataset.url=result.url;
      if(remove){
        remove.dataset.url=result.url;
        remove.setAttribute("aria-label",`Remove ${result.title}`);
      }
    }
    cfg.links=customLinks;
    cfg.hiddenLinks=[...new Set(hiddenLinks)];
    cfg.renames={...localRenames};
    cfg.layout={};
    syncActiveDeviceLayoutFromState(false);
    cfg.deviceLayouts=normalizeDeviceLayouts(deviceLayouts);
    cfg.siteGridOrder=[...siteGridOrder];
    queueAllLinkTitleTranslations(result.title,{url:result.url,type:"WEB",group:"Custom"});
    saveCfg("",false);
    editJsonDirty=true;
    render();
  }
  return true;
}

function syncCubeExpandTemplate(){

    const col=Math.min(6,Math.max(1,Number(cell.dataset.cubeExpandCol||1)));
    const row=Math.min(2,Math.max(1,Number(cell.dataset.cubeExpandRow||1)));
    const selected=col<=cubeExpandCols&&(row===1||cubeExpandRows===2);
    cell.classList.toggle("selected",selected);
    cell.setAttribute("aria-pressed",selected?"true":"false");
  });
}

function chooseCubeExpand(position){
  const cell=cubeExpandGrid&&cubeExpandGrid.querySelector(`[data-cube-expand-cell="${CSS.escape(String(position||""))}"]`);
  if(!cell)return;
  const chosenCols=Math.min(6,Math.max(1,Number(cell.dataset.cubeExpandCol||1)));
  const chosenRows=Math.min(2,Math.max(1,Number(cell.dataset.cubeExpandRow||1)));
  if(chosenCols===cubeExpandCols&&chosenRows===cubeExpandRows){
    cubeExpandCols=1;
    cubeExpandRows=1;
  }else{
    cubeExpandCols=chosenCols;
    cubeExpandRows=chosenRows;
  }
  syncCubeExpandTemplate();
}

function mergedLinkRecords(){
  const merged=new Map();
  defaultLinks.forEach(item=>merged.set(String(item.url),{...item}));
  customLinks.forEach(item=>{
    const url=String(item.url);
    const defaultItem=merged.get(url);
    merged.set(url,defaultItem
      ?{...defaultItem,...item,i18nKey:item.i18nKey||defaultItem.i18nKey}
      :{...item}
    );
  });
  return [...merged.values()];
}

function englishTitleForLink(item,renames=renameMap()){
  const url=String(item&&item.url||"");
  const profile=normalizeDeviceLayoutProfile(deviceLayouts[activeDeviceLayoutKey],defaultDeviceLayouts()[activeDeviceLayoutKey]);
  const deviceTitle=profile.titleOverrides&&profile.titleOverrides[url];
  if(deviceTitle!=null&&String(deviceTitle).trim())return String(deviceTitle).trim();
  const renamed=renames[url];
  if(renamed!=null&&String(renamed).trim())return String(renamed).trim();
  if(item&&item.title!=null&&String(item.title).trim())return String(item.title).trim();
  if(item&&item.i18nKey&&LINK_I18N.en[item.i18nKey])return String(LINK_I18N.en[item.i18nKey]);
  return "";
}

function englishLinks(){
  const renames=renameMap();
  const hidden=new Set(hiddenLinks.map(String));
  return mergedLinkRecords()
    .filter(item=>!hidden.has(String(item.url)))
    .map(item=>({
      ...item,
      title:englishTitleForLink(item,renames).toLocaleUpperCase("en-US"),
      direction:"ltr"
    }));
}

function links(){

function remoteConfigSignature(data){
  const stable={
    version:Number(data.version||3),
    updatedAt:Number(data.updatedAt||0),
    fontSize:data.fontSize,
    menuWidth:data.menuWidth,
    language:data.language,
    languageX:data.languageX,
    languageY:data.languageY,
    languageControlSize:data.languageControlSize,
    paintButtonX:data.paintButtonX,
    paintButtonY:data.paintButtonY,
    paintButtonSize:data.paintButtonSize,
    paintButtonNames:data.paintButtonNames&&typeof data.paintButtonNames==="object"?data.paintButtonNames:{},
    linkTitleTranslations:cleanLinkTitleTranslationCache(data.linkTitleTranslations),
    enabledLanguages:Array.isArray(data.enabledLanguages)?data.enabledLanguages:[],
    links:Array.isArray(data.links)?data.links:[],
    hiddenLinks:Array.isArray(data.hiddenLinks)?data.hiddenLinks:[],
    renames:data.renames&&typeof data.renames==="object"?data.renames:{},
    layout:{},
    deviceLayouts:data.deviceLayouts&&typeof data.deviceLayouts==="object"&&!Array.isArray(data.deviceLayouts)
      ?normalizeDeviceLayouts(data.deviceLayouts)
      :{},
    siteGridOrder:Array.isArray(data.siteGridOrder)?data.siteGridOrder:[],
    textNumber:normalizeTextNumber(data.textNumber)||DEFAULT_TEXT_NUMBER,
    cubeSpans:normalizeCubeSpans(data.cubeSpans),
    devCode:data.devCode
  };
  const source=JSON.stringify(stable);
  let hash=2166136261;
  for(let index=0;index<source.length;index++){
    hash^=source.charCodeAt(index);
    hash=Math.imul(hash,16777619);
  }
  return(source.length+":"+(hash>>>0).toString(16));
}

async function fetchRemoteConfigFile(){
  const candidates=[REMOTE_FILE,"sitemap-config.json"];
  for(const filename of candidates){
    try{
      const url=new URL(filename,document.baseURI);
      url.searchParams.set("sync",Date.now().toString());
      const response=await fetch(url.href,{
        cache:"no-store",
        headers:{"Cache-Control":"no-cache","Pragma":"no-cache"}
      });
      if(!response.ok)continue;
      const data=await response.json();
      if(data&&Array.isArray(data.links))return data;
    }catch(_){}
  }
  return null;
}

async function loadRemote(){
  if(!["http:","https:"].includes(location.protocol))return;
  try{
    const data=await fetchRemoteConfigFile();
    if(!data)return;

    const signature=remoteConfigSignature(data);
    if(signature&&signature===String(cfg.lastRemoteSignature||""))return;

    const remoteUpdatedAt=Number(data.updatedAt||0);

    customLinks=data.links.filter(
      x=>x&&typeof x.title==="string"&&typeof x.url==="string"
    );

    hiddenLinks=Array.isArray(data.hiddenLinks)
      ?[...new Set(data.hiddenLinks.map(String))]
      :[];

    remoteRenames=
      data.renames&&typeof data.renames==="object"&&!Array.isArray(data.renames)
        ?data.renames
        :{};

    syncActiveDeviceLayoutFromState(false);
    if(data.deviceLayouts&&typeof data.deviceLayouts==="object"&&!Array.isArray(data.deviceLayouts)){
      deviceLayouts=mergeDeviceLayouts(deviceLayouts,data.deviceLayouts);
    }
    // Legacy JSON can still update shared links and settings, but it cannot
    // overwrite any desktop/mobile layout profile.
    loadActiveDeviceLayout(activeDeviceLayoutKey);
    if(normalizeTextNumber(data.textNumber)){
      textNumber=normalizeTextNumber(data.textNumber);
      syncTextNumberUi();
    }
    layout={};

    if(/^\d{4}$/.test(String(data.devCode||""))){
      devCode=String(data.devCode);
    }

    cfg.links=customLinks;
    cfg.hiddenLinks=[...new Set(hiddenLinks)];
    cfg.renames=renameMap();
    if(data.paintButtonNames&&typeof data.paintButtonNames==="object"&&!Array.isArray(data.paintButtonNames)){
      paintButtonNames={...data.paintButtonNames};
    }
    cfg.paintButtonNames={...paintButtonNames};
    cachedLinkTitleTranslations={
      ...cachedLinkTitleTranslations,
      ...cleanLinkTitleTranslationCache(data.linkTitleTranslations)
    };
    cfg.linkTitleTranslations={...cachedLinkTitleTranslations};
    cfg.layout={};
    cfg.deviceLayouts=normalizeDeviceLayouts(deviceLayouts);
    cfg.siteGridOrder=[...siteGridOrder];
    cfg.textNumber=textNumber;
    cfg.cubeSpans=normalizeCubeSpans(cubeSpans);
    cfg.devCode=devCode;
    cfg.lastRemoteUpdatedAt=remoteUpdatedAt||Date.now();
    cfg.lastRemoteSignature=signature;
    cfg.updatedAt=Math.max(Number(cfg.updatedAt||0),remoteUpdatedAt);

    if(Number.isFinite(Number(data.fontSize))){
      cfg.fontSize=Math.min(32,Math.max(8,Number(data.fontSize)));
      applyFontSize(cfg.fontSize,false);
    }

    if(Number.isFinite(Number(data.menuWidth))){
      cfg.menuWidth=Math.min(
        520,
        Math.max(180,Math.round(Number(data.menuWidth)/10)*10)
      );
      applyMenuSize(cfg.menuWidth,false);
    }

    if(Number.isFinite(Number(data.languageX))){
      languageX=Math.min(100,Math.max(0,Number(data.languageX)));
      cfg.languageX=languageX;
    }

    if(Number.isFinite(Number(data.languageY))){
      languageY=Math.min(100,Math.max(0,Number(data.languageY)));
      cfg.languageY=languageY;
    }

    if(Number.isFinite(Number(data.languageControlSize))){
      languageControlSize=Math.min(
        180,
        Math.max(
          60,
          Math.round(Number(data.languageControlSize)/5)*5
        )
      );
      cfg.languageControlSize=languageControlSize;
    }

    applyLanguageControlLayout(
      languageX,
      languageY,
      languageControlSize,
      false
    );

    if(Number.isFinite(Number(data.paintButtonX)))paintButtonX=Math.min(100,Math.max(0,Number(data.paintButtonX)));
    if(Number.isFinite(Number(data.paintButtonY)))paintButtonY=Math.min(100,Math.max(0,Number(data.paintButtonY)));
    if(Number.isFinite(Number(data.paintButtonSize)))paintButtonSize=Math.min(200,Math.max(60,Math.round(Number(data.paintButtonSize)/5)*5));
    if(Number.isFinite(Number(data.paintToolFontSize)))paintToolFontSize=Math.min(48,Math.max(3,Number(data.paintToolFontSize)));

    if(Array.isArray(data.enabledLanguages)){
      enabledLanguages=[...new Set([
        ...BASE_LANGUAGES,
        ...data.enabledLanguages
          .map(String)
          .filter(code=>SUPPORTED_LANGUAGES.includes(code))
      ])];
      cfg.enabledLanguages=[...enabledLanguages];
    }

    if(SUPPORTED_LANGUAGES.includes(String(data.language||""))){
      language=String(data.language);
      if(!enabledLanguages.includes(language)){
        enabledLanguages.push(language);
      }
      cfg.language=language;
      cfg.enabledLanguages=[...enabledLanguages];
      document.documentElement.lang=language;
      rebuildLanguageSelect();
    }

    saveCfg("",false);
    queueAllVisibleLinkTitleTranslations();
    render();
  }catch(_){}
}

function isDeveloperInteractionTarget(target){
  if(!(target instanceof Element))return false;

  if(toolPanel.contains(target))return true;
  if(editLinkModal.classList.contains("open")&&editLinkModal.contains(target))return true;
  if(addLinkModal.classList.contains("open")&&addLinkModal.contains(target))return true;
  if(changeCodeModal.classList.contains("open")&&changeCodeModal.contains(target))return true;
  if(changeNumberModal.classList.contains("open")&&changeNumberModal.contains(target))return true;
  if(cubeExpandModal.classList.contains("open")&&cubeExpandModal.contains(target))return true;
  if(languagePanel.contains(target))return true;
  if(requestLanguageButton.contains(target))return true;
  if(paintLauncher.contains(target))return true;
  if(dragEnabled&&target.closest("[data-site-grid-key]"))return true;

  return Boolean(
    target.closest(
      ".change-code-box,"+
      ".change-number-box,"+
      ".cube-expand-box,"+
      ".add-link-box,"+
      ".remove-link-box,"+
      ".edit-link-box,"+
      ".paint-box,"+
      ".language-request-box"
    )
  );
}

document.addEventListener("keydown",event=>{
  if(!paintModal.classList.contains("open"))return;

  const modifier=event.ctrlKey||event.metaKey;
  const key=String(event.key||"").toLowerCase();

  if(modifier&&key==="z"){
    event.preventDefault();

    if(event.shiftKey){
      redoPaint();
    }else{
      undoPaint();
    }
  }else if(modifier&&key==="y"){
    event.preventDefault();
    redoPaint();
  }else if(modifier&&key==="c"){
    event.preventDefault();
    copyPaintSelection();
  }else if(modifier&&key==="v"){
    event.preventDefault();
    pastePaintSelection();
  }else if(
    (event.key==="Delete"||event.key==="Backspace")&&
    !event.target.closest("input,textarea")
  ){
    event.preventDefault();
    deletePaintSelection();
  }
});
